# Dry-run for factorial clusters (local stub, no Ollama).
dataset: experiments/data/fixtures/factorial_smoke.jsonl
output_dir: experiments/results/factorial_dryrun

models:
  - local-stub
  - qwen2.5-1.5b-stubscale
  - qwen2.5-3b-stubscale

conditions:
  - direct

sampling:
  temperatures: [0.0]
  n_samples: 1
  seed: 0
  max_tokens: 128

dry_run: true
rasp_report: experiments/results/factorial_dryrun/rasp_difficulty.json
scale_join: experiments/results/factorial_dryrun/rasp_scale_join.json

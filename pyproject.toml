[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uneven-decimal-benchmark"
version = "0.1.0"
description = "Benchmark for LLM chain-sum reasoning over uneven decimals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
udb-generate = "experiments.scripts.generate_cli:main"
udb-verify-lean = "experiments.scripts.verify_lean_cli:main"
udb-eval = "experiments.scripts.eval_cli:main"
udb-aggregate = "experiments.scripts.aggregate_cli:main"
udb-rasp = "experiments.scripts.rasp_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiments*"]

[tool.setuptools.package-data]
experiments = ["configs/*.yaml", "data/fixtures/*.jsonl"]

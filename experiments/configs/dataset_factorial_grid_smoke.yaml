# Tiny F×C×N smoke (2 per cluster) for pipeline checks.
seed: 99
output: experiments/data/fixtures/factorial_grid_smoke.jsonl

defaults:
  int_digits_min: 1
  int_digits_max: 2
  allow_negative: false
  aligned: true
  alignment_level: 0

factors:
  frac:
    F0: { level: 0, frac_digits: 2, frac_digits_min: 2, frac_digits_max: 2 }
    F1: { level: 1, frac_digits: 4, frac_digits_min: 4, frac_digits_max: 4 }
  carry:
    C0: { level: 0, carry_bias: low }
    C1: { level: 1, carry_bias: high }
  n_addends:
    N3: { n_addends: 3 }
    N5: { n_addends: 5 }

clusters:
  F0C0N3: { count: 2, frac: F0, carry: C0, n_addends_factor: N3 }
  F0C1N3: { count: 2, frac: F0, carry: C1, n_addends_factor: N3 }
  F1C0N3: { count: 2, frac: F1, carry: C0, n_addends_factor: N3 }
  F1C1N3: { count: 2, frac: F1, carry: C1, n_addends_factor: N3 }
  F0C0N5: { count: 2, frac: F0, carry: C0, n_addends_factor: N5 }
  F0C1N5: { count: 2, frac: F0, carry: C1, n_addends_factor: N5 }
  F1C0N5: { count: 2, frac: F1, carry: C0, n_addends_factor: N5 }
  F1C1N5: { count: 2, frac: F1, carry: C1, n_addends_factor: N5 }

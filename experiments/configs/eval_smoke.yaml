# Tiny end-to-end smoke config for local dry-runs (no API spend).
dataset: experiments/data/fixtures/smoke.jsonl
output_dir: experiments/results/smoke

models:
  - local-stub

conditions:
  - direct
  - scratch_partial
  - align_hint
  - scratch_align

sampling:
  temperatures: [0.0, 0.7]
  n_samples: 2
  seed: 0
  max_tokens: 256

dry_run: true

# Model adapters. API keys come from environment variables (see .env.example).
# tools / function calling are always disabled by the clients.

models:
  gpt-4o:
    provider: openai
    model: gpt-4o
    max_tokens: 1024

  gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 1024

  qwen2.5-7b-instruct:
    provider: hf
    model: Qwen/Qwen2.5-7B-Instruct
    max_tokens: 1024

  # Local Ollama pilots (~3–4B). Requires `ollama serve` + pulled model.
  ollama-qwen2.5-3b:
    provider: ollama
    model: qwen2.5:3b
    approx_params_b: 3.0
    max_tokens: 1024

  ollama-phi3-mini:
    provider: ollama
    model: phi3:mini
    approx_params_b: 3.8
    max_tokens: 1024

  # Deterministic stub for pipeline dry-runs (no network).
  local-stub:
    provider: local_stub
    model: local-stub
    max_tokens: 256

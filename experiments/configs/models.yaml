# Model adapters. API keys come from environment variables (see .env.example).
# tools / function calling are always disabled by the clients.

models:
  gpt-4o:
    provider: openai
    model: gpt-4o
    max_tokens: 1024

  gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 1024

  qwen2.5-7b-instruct:
    provider: hf
    model: Qwen/Qwen2.5-7B-Instruct
    max_tokens: 1024

  # Local Transformers stub (not required for phase-1 dry-run).
  local-stub:
    provider: local_stub
    model: local-stub
    max_tokens: 256

# Large F×C×N trend grid: DeepSeek + Ollama
# (generate dataset_factorial_grid_large.yaml first).
dataset: experiments/data/dataset_factorial_grid_large.jsonl
output_dir: experiments/results/grid_large_deepseek_ollama

models:
  - deepseek-chat
  - ollama-qwen2.5-3b

conditions:
  - direct

sampling:
  temperatures: [0.0]
  n_samples: 1
  seed: 0
  max_tokens: 512

dry_run: false
rasp_report: experiments/results/grid_large_deepseek_ollama/rasp_difficulty.json
scale_join: experiments/results/grid_large_deepseek_ollama/rasp_scale_join.json

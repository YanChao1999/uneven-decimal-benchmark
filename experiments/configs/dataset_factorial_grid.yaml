# Three independent difficulty axes (beyond A0C0-style alignment×carry):
#   F = fractional / decimal-place length
#   C = carry-chain depth
#   N = number of addends (chain length)
# Alignment kept even (A0) here so F/C/N effects are not confounded with unevenness.
# For uneven alignment, use dataset_factorial_easy / dataset_factorial.
# For a denser trend matrix (5×3×7), use dataset_factorial_grid_large.yaml.
seed: 99
output: experiments/data/dataset_factorial_grid.jsonl

defaults:
  int_digits_min: 1
  int_digits_max: 2
  allow_negative: false
  aligned: true
  alignment_level: 0

factors:
  frac:
    F0:  # short decimal places
      level: 0
      frac_digits: 2
      frac_digits_min: 2
      frac_digits_max: 2
    F1:  # medium
      level: 1
      frac_digits: 4
      frac_digits_min: 4
      frac_digits_max: 4
    F2:  # long
      level: 2
      frac_digits: 6
      frac_digits_min: 6
      frac_digits_max: 6
  carry:
    C0:
      level: 0
      carry_bias: low
    C1:
      level: 1
      carry_bias: high
  n_addends:
    N3:
      n_addends: 3
    N5:
      n_addends: 5
    N8:
      n_addends: 8

# 3×2×3 = 18 clusters × 20 = 360 examples
clusters:
  F0C0N3: { count: 20, frac: F0, carry: C0, n_addends_factor: N3 }
  F0C0N5: { count: 20, frac: F0, carry: C0, n_addends_factor: N5 }
  F0C0N8: { count: 20, frac: F0, carry: C0, n_addends_factor: N8 }
  F0C1N3: { count: 20, frac: F0, carry: C1, n_addends_factor: N3 }
  F0C1N5: { count: 20, frac: F0, carry: C1, n_addends_factor: N5 }
  F0C1N8: { count: 20, frac: F0, carry: C1, n_addends_factor: N8 }
  F1C0N3: { count: 20, frac: F1, carry: C0, n_addends_factor: N3 }
  F1C0N5: { count: 20, frac: F1, carry: C0, n_addends_factor: N5 }
  F1C0N8: { count: 20, frac: F1, carry: C0, n_addends_factor: N8 }
  F1C1N3: { count: 20, frac: F1, carry: C1, n_addends_factor: N3 }
  F1C1N5: { count: 20, frac: F1, carry: C1, n_addends_factor: N5 }
  F1C1N8: { count: 20, frac: F1, carry: C1, n_addends_factor: N8 }
  F2C0N3: { count: 20, frac: F2, carry: C0, n_addends_factor: N3 }
  F2C0N5: { count: 20, frac: F2, carry: C0, n_addends_factor: N5 }
  F2C0N8: { count: 20, frac: F2, carry: C0, n_addends_factor: N8 }
  F2C1N3: { count: 20, frac: F2, carry: C1, n_addends_factor: N3 }
  F2C1N5: { count: 20, frac: F2, carry: C1, n_addends_factor: N5 }
  F2C1N8: { count: 20, frac: F2, carry: C1, n_addends_factor: N8 }
